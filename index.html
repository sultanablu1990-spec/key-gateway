crossorigin="anonymous"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:90%;
  max-width:450px;
  background:#1e293b;
  padding:30px;
  border-radius:20px;
  text-align:center;
}
.timer{
  font-size:55px;
  font-weight:bold;
  margin:25px;
}
button{
  padding:14px 28px;
  border:0;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
}
button:disabled{
  opacity:.5;
}
.key{
  font-size:35px;
  font-weight:bold;
  margin:25px;
}
</style>
</head>

<body>

<div class="card">

<div id="gateway">
<h1>Continue</h1>
<p>ধাপ <span id="step">1</span> / 6</p>

<p>বিজ্ঞাপন এখানে স্বাভাবিকভাবে প্রদর্শিত হতে পারে।</p>

<div class="timer" id="timer">15</div>

<button id="next" disabled>অপেক্ষা করুন</button>
</div>

<div id="result" style="display:none">
<h1>Your Key</h1>
<p>৬টি ধাপ সম্পন্ন হয়েছে।</p>
<div class="key">1122</div>
</div>

</div>

<script>
let step=1;
let time=15;

const timer=document.getElementById("timer");
const button=document.getElementById("next");
const stepText=document.getElementById("step");

function startTimer(){

time=15;
timer.textContent=time;
button.disabled=true;
button.textContent="অপেক্ষা করুন";

let countdown=setInterval(function(){

time--;
timer.textContent=time;

if(time<=0){

clearInterval(countdown);

button.disabled=false;
button.textContent=step===6?"Key দেখুন":"Continue";

}

},1000);

}

button.onclick=function(){

if(step===6){

document.getElementById("gateway").style.display="none";
document.getElementById("result").style.display="block";
return;

}

step++;
stepText.textContent=step;
startTimer();

};

startTimer();
</script>

</body>
</html>
